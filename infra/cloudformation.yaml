AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  HW4 CloudTask - VPC (public/private x2 AZ), ALB path routing, ECS on EC2,
  RDS Postgres (private), S3 images, CloudWatch alarms + service autoscaling.
  Ephemeral demo stack.

Parameters:
  DBUsername:
    Type: String
    Default: cloudtask
  DBPassword:
    Type: String
    NoEcho: true
    Description: Master password for RDS (pass via --parameter-overrides)
  DBName:
    Type: String
    Default: cloudtask_db
  S3BucketName:
    Type: String
    Default: cloudtask-images-340514595007
    Description: Must be globally unique
  InstanceType:
    Type: String
    Default: t3.micro
  DesiredCount:
    Type: Number
    Default: 2
  EcsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id

Resources:
  # ---------------- VPC & connectivity ----------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: cloudtask-vpc }, { Key: Project, Value: cloudtask-hw4 }]

  IGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: cloudtask-igw }, { Key: Project, Value: cloudtask-hw4 }]

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref IGW

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: cloudtask-public-1a }, { Key: Project, Value: cloudtask-hw4 }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: cloudtask-public-1b }, { Key: Project, Value: cloudtask-hw4 }]

  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: cloudtask-app-1a }, { Key: Project, Value: cloudtask-hw4 }]

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: cloudtask-app-1b }, { Key: Project, Value: cloudtask-hw4 }]

  DataSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.21.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: cloudtask-data-1a }, { Key: Project, Value: cloudtask-hw4 }]

  DataSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.22.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: cloudtask-data-1b }, { Key: Project, Value: cloudtask-hw4 }]

  PublicRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: cloudtask-public-rt }, { Key: Project, Value: cloudtask-hw4 }]

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

  PublicAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRT }
  PublicAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRT }

  PrivateRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: cloudtask-private-rt }, { Key: Project, Value: cloudtask-hw4 }]

  NatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: cloudtask-nat-eip }, { Key: Project, Value: cloudtask-hw4 }]

  NatGW:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref PublicSubnetA
      AllocationId: !GetAtt NatEIP.AllocationId
      Tags: [{ Key: Name, Value: cloudtask-nat }, { Key: Project, Value: cloudtask-hw4 }]

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRT
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGW

  AppAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppSubnetA, RouteTableId: !Ref PrivateRT }
  AppAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppSubnetB, RouteTableId: !Ref PrivateRT }
  DataAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DataSubnetA, RouteTableId: !Ref PrivateRT }
  DataAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DataSubnetB, RouteTableId: !Ref PrivateRT }

  # ---------------- NACLs ----------------
  PublicNACL:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: cloudtask-nacl-public }, { Key: Project, Value: cloudtask-hw4 }]
  AppNACL:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: cloudtask-nacl-app }, { Key: Project, Value: cloudtask-hw4 }]
  DataNACL:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: cloudtask-nacl-data }, { Key: Project, Value: cloudtask-hw4 }]

  PubNaclIn80:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNACL, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 80, To: 80 } }
  PubNaclIn443:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNACL, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 443, To: 443 } }
  PubNaclInEph:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNACL, RuleNumber: 120, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } }
  PubNaclOutApp:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNACL, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.0.0.0/16, PortRange: { From: 3000, To: 3001 } }
  PubNaclOut443:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNACL, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0, PortRange: { From: 443, To: 443 } }
  PubNaclOutEph:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNACL, RuleNumber: 120, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } }

  AppNaclInApp1:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref AppNACL, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.0.1.0/24, PortRange: { From: 3000, To: 3001 } }
  AppNaclInApp2:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref AppNACL, RuleNumber: 105, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.0.2.0/24, PortRange: { From: 3000, To: 3001 } }
  AppNaclInDyn1:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref AppNACL, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.0.1.0/24, PortRange: { From: 32768, To: 65535 } }
  AppNaclInDyn2:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref AppNACL, RuleNumber: 115, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.0.2.0/24, PortRange: { From: 32768, To: 65535 } }
  AppNaclInEph:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref AppNACL, RuleNumber: 120, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } }
  AppNaclInDns:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref AppNACL, RuleNumber: 125, Protocol: 17, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } }
  AppNaclOut80:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref AppNACL, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0, PortRange: { From: 80, To: 80 } }
  AppNaclOut443:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref AppNACL, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0, PortRange: { From: 443, To: 443 } }
  AppNaclOutDb1:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref AppNACL, RuleNumber: 120, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.0.21.0/24, PortRange: { From: 5432, To: 5432 } }
  AppNaclOutDb2:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref AppNACL, RuleNumber: 125, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.0.22.0/24, PortRange: { From: 5432, To: 5432 } }
  AppNaclOutEph:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref AppNACL, RuleNumber: 130, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } }
  AppNaclOutDns:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref AppNACL, RuleNumber: 140, Protocol: 17, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0, PortRange: { From: 53, To: 53 } }

  DataNaclInDb1:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref DataNACL, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.0.11.0/24, PortRange: { From: 5432, To: 5432 } }
  DataNaclInDb2:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref DataNACL, RuleNumber: 105, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.0.12.0/24, PortRange: { From: 5432, To: 5432 } }
  DataNaclOutEph:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref DataNACL, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.0.0.0/16, PortRange: { From: 1024, To: 65535 } }

  PubNaclAssocA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, NetworkAclId: !Ref PublicNACL }
  PubNaclAssocB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, NetworkAclId: !Ref PublicNACL }
  AppNaclAssocA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref AppSubnetA, NetworkAclId: !Ref AppNACL }
  AppNaclAssocB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref AppSubnetB, NetworkAclId: !Ref AppNACL }
  DataNaclAssocA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref DataSubnetA, NetworkAclId: !Ref DataNACL }
  DataNaclAssocB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref DataSubnetB, NetworkAclId: !Ref DataNACL }

  # ---------------- Security groups ----------------
  AlbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB public HTTP
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: cloudtask-alb-sg }, { Key: Project, Value: cloudtask-hw4 }]

  AppSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS container instances, only from ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3000, ToPort: 3001, SourceSecurityGroupId: !Ref AlbSG }
        - { IpProtocol: tcp, FromPort: 32768, ToPort: 65535, SourceSecurityGroupId: !Ref AlbSG }
      Tags: [{ Key: Name, Value: cloudtask-app-sg }, { Key: Project, Value: cloudtask-hw4 }]

  DataSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Postgres, only from app tier
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSG }
      Tags: [{ Key: Name, Value: cloudtask-data-sg }, { Key: Project, Value: cloudtask-hw4 }]

  # ---------------- S3 + ECR ----------------
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      Tags: [{ Key: Name, Value: cloudtask-images }, { Key: Project, Value: cloudtask-hw4 }]

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadTaskImages
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${ImageBucket}/tasks/*

  ApiRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: cloudtask-api
      ImageScanningConfiguration: { ScanOnPush: true }
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  WebRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: cloudtask-web
      ImageScanningConfiguration: { ScanOnPush: true }
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  # ---------------- Logs ----------------
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/cloudtask-api
      RetentionInDays: 7
  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/cloudtask-web
      RetentionInDays: 7

  # ---------------- IAM ----------------
  EcsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudtask-ecs-instance-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: cloudtask-s3-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub arn:aws:s3:::${ImageBucket}/tasks/*
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !Sub arn:aws:s3:::${ImageBucket}
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  EcsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: cloudtask-ecs-instance-profile
      Roles: [!Ref EcsInstanceRole]

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudtask-task-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudtask-api-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cloudtask-s3-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub arn:aws:s3:::${ImageBucket}/tasks/*
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  # ---------------- RDS ----------------
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: RDS data tier
      SubnetIds: [!Ref DataSubnetA, !Ref DataSubnetB]
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: cloudtask-db
      Engine: postgres
      EngineVersion: "17.11"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp2
      StorageEncrypted: true
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DataSG]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0
      DeletionProtection: false
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  # ---------------- ALB ----------------
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: cloudtask-alb
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSG]
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  WebTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: cloudtask-web-tg
      Protocol: HTTP
      Port: 3000
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckPath: /
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  ApiTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: cloudtask-api-tg
      Protocol: HTTP
      Port: 3001
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckPath: /api/
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTG

  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values: [/api/*]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTG

  # ---------------- ECS ----------------
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: cloudtask-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: cloudtask-lt
      LaunchTemplateData:
        ImageId: !Ref EcsAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Name: !Ref EcsInstanceProfile }
        SecurityGroupIds: [!Ref AppSG]
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              echo ECS_CLUSTER=${ClusterName} >> /etc/ecs/ecs.config
            - ClusterName: !Ref ECSCluster
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: cloudtask-app }
              - { Key: Project, Value: cloudtask-hw4 }
      TagSpecifications:
        - ResourceType: launch-template
          Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  AppASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: cloudtask-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: 2
      MaxSize: 4
      DesiredCapacity: 2
      VPCZoneIdentifier: [!Ref AppSubnetA, !Ref AppSubnetB]
      HealthCheckType: EC2
      HealthCheckGracePeriod: 300
      Tags:
        - { Key: Name, Value: cloudtask-app, PropagateAtLaunch: true }
        - { Key: Project, Value: cloudtask-hw4, PropagateAtLaunch: true }

  CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      Name: cloudtask-cap
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref AppASG
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
          MinimumScalingStepSize: 1
          MaximumScalingStepSize: 2
        ManagedTerminationProtection: DISABLED
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  ClusterCPAssoc:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref ECSCluster
      CapacityProviders: [!Ref CapacityProvider]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Base: 2
          Weight: 1

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cloudtask-api
      NetworkMode: bridge
      RequiresCompatibilities: [EC2]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/cloudtask-api:latest
          MemoryReservation: 300
          PortMappings:
            - { ContainerPort: 3001, HostPort: 0, Protocol: tcp }
          Environment:
            - { Name: PORT, Value: "3001" }
            - Name: DATABASE_URL
              Value: !Sub
                - postgres://${User}:${Pass}@${Endpoint}:5432/${Db}?sslmode=require
                - User: !Ref DBUsername
                  Pass: !Ref DBPassword
                  Endpoint: !GetAtt Database.Endpoint.Address
                  Db: !Ref DBName
            - Name: FRONTEND_URL
              Value: !Sub http://${ALB.DNSName}
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: AWS_S3_BUCKET, Value: !Ref ImageBucket }
            - { Name: NODE_TLS_REJECT_UNAUTHORIZED, Value: "0" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cloudtask-web
      NetworkMode: bridge
      RequiresCompatibilities: [EC2]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/cloudtask-web:latest
          MemoryReservation: 300
          PortMappings:
            - { ContainerPort: 3000, HostPort: 0, Protocol: tcp }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: cloudtask-api
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 300
      PlacementStrategies:
        - { Type: spread, Field: attribute:ecs.availability-zone }
      LoadBalancers:
        - TargetGroupArn: !Ref ApiTG
          ContainerName: api
          ContainerPort: 3001
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  WebService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: cloudtask-web
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref WebTaskDefinition
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 300
      PlacementStrategies:
        - { Type: spread, Field: attribute:ecs.availability-zone }
      LoadBalancers:
        - TargetGroupArn: !Ref WebTG
          ContainerName: web
          ContainerPort: 3000
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  # ---------------- Autoscaling & alarms ----------------
  ApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub service/${ECSCluster}/${ApiService.Name}
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: 2
      MaxCapacity: 6

  ApiCpuTracking:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: cloudtask-api-cpu-tracking
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleOutCooldown: 60
        ScaleInCooldown: 300

  ApiCpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cloudtask-api-cpu-high
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - { Name: ClusterName, Value: !Ref ECSCluster }
        - { Name: ServiceName, Value: !GetAtt ApiService.Name }
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  Alb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cloudtask-alb-5xx
      MetricName: HTTPCode_Target_5XX_Count
      Namespace: AWS/ApplicationELB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ALB.LoadBalancerFullName
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

  UnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cloudtask-unhealthy-hosts
      MetricName: UnHealthyHostCount
      Namespace: AWS/ApplicationELB
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt WebTG.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt ALB.LoadBalancerFullName
      Tags: [{ Key: Project, Value: cloudtask-hw4 }]

Outputs:
  AlbDNS:
    Value: !GetAtt ALB.DNSName
  WebURL:
    Value: !Sub http://${ALB.DNSName}/
  ApiURL:
    Value: !Sub http://${ALB.DNSName}/api/
  RdsEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  BucketName:
    Value: !Ref ImageBucket
  ClusterName:
    Value: !Ref ECSCluster
